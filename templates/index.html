<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Control Remoto PC</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 90%; max-width: 400px; }
    .btn { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 15px; width: 100%; }
    .btn:active { background: #0056b3; }
    #stream-container { display: none; width: 100%; height: 100vh; flex-direction: column; justify-content: center; align-items: center; background: #000; }
    #screen { width: 100%; max-height: 80vh; object-fit: contain; }
    .status-dot { height: 12px; width: 12px; background-color: #ff4d4d; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .status-dot.online { background-color: #2ea44f; }
  </style>
</head>
<body>

  <!-- Vista 1: PC Apagada -->
  <div id="offline-ui" class="card">
    <h2><span id="dot" class="status-dot"></span><span id="status-text">PC Apagada</span></h2>
    <p style="color: #aaa; margin-top: 10px;">Presiona el botón para enviar la señal de encendido (Wake-on-LAN).</p>
    <button class="btn" onclick="wakePC()">Encender PC</button>
  </div>

  <!-- Vista 2: Streaming Activo -->
  <div id="stream-container">
    <img id="screen" src="" alt="Stream de PC">
  </div>

  <script>
    const socket = io();
    const offlineUi = document.getElementById('offline-ui');
    const streamContainer = document.getElementById('stream-container');
    const screenImg = document.getElementById('screen');
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('status-text');

    // Escuchar el cambio de estado enviado por Render
    socket.on('status_change', (data) => {
      if (data.online) {
        offlineUi.style.display = 'none';
        streamContainer.style.display = 'flex';
      } else {
        offlineUi.style.display = 'block';
        streamContainer.style.display = 'none';
        dot.classList.remove('online');
        statusText.innerText = 'PC Apagada';
      }
    });

    // Recibir frames de imagen desde la PC
    socket.on('screen_frame', (data) => {
      offlineUi.style.display = 'none';
      streamContainer.style.display = 'flex';
      screenImg.src = 'data:image/jpeg;base64,' + data.image;
    });

    function wakePC() {
      fetch('/api/wake', { method: 'POST' })
        .then(res => res.json())
        .then(data => alert(data.message))
        .catch(err => alert('Error enviando paquete WAKE'));
    }

    // Controles táctiles del celular enviados a la PC
    let lastX = 0, lastY = 0;
    screenImg.addEventListener('touchstart', (e) => {
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    });

    screenImg.addEventListener('touchmove', (e) => {
      let dx = e.touches[0].clientX - lastX;
      let dy = e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
      socket.emit('input_event', { type: 'mouse_move', dx: dx, dy: dy });
    });

    screenImg.addEventListener('click', () => {
      socket.emit('input_event', { type: 'mouse_click', action: 'left' });
    });
  </script>
</body>
</html>
